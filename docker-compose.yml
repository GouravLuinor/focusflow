version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow_dev
      POSTGRES_DB: focusflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
