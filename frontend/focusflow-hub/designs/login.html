<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login - FocusFlow</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#eae6f4",
                        "surface-variant": "#e4e1ee",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "primary": "#3525cd",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb695",
                        "surface-container": "#f0ecf9",
                        "tertiary-fixed": "#ffdbcc",
                        "active-glow": "rgba(79, 70, 229, 0.15)",
                        "inverse-on-surface": "#f3effc",
                        "on-tertiary-container": "#ffd2be",
                        "secondary-container": "#e0dfde",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "border": "#E8E6E1",
                        "outline-variant": "#c7c4d8",
                        "warning": "#D97706",
                        "surface-bright": "#fcf8ff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-tertiary-fixed": "#351000",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#a44100",
                        "on-secondary-fixed-variant": "#464746",
                        "outline": "#777587",
                        "primary-fixed": "#e2dfff",
                        "success": "#059669",
                        "text-primary": "#1A1A1A",
                        "secondary-fixed-dim": "#c7c6c5",
                        "text-muted": "#9E988E",
                        "surface": "#FFFFFF",
                        "surface-container-highest": "#e4e1ee",
                        "tertiary": "#7e3000",
                        "surface-tint": "#4d44e3",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "inverse-surface": "#302f39",
                        "on-background": "#1b1b24",
                        "on-secondary-fixed": "#1a1c1b",
                        "secondary-fixed": "#e3e2e0",
                        "on-primary-fixed-variant": "#3323cc",
                        "secondary": "#5e5e5d",
                        "background": "#fcf8ff",
                        "inverse-primary": "#c3c0ff",
                        "text-secondary": "#6B6660",
                        "surface-dim": "#dcd8e5",
                        "surface-container-low": "#f5f2ff",
                        "on-secondary-container": "#626361",
                        "primary-container": "#4f46e5",
                        "on-primary-container": "#dad7ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "screen-padding-desktop": "32px",
                        "card-gap": "16px",
                        "screen-padding-mobile": "24px",
                        "section-gap": "32px",
                        "element-gap": "12px",
                        "card-padding": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["lexend"],
                        "task-title": ["lexend"],
                        "label": ["lexend"],
                        "headline-md": ["lexend"],
                        "body-sm": ["lexend"],
                        "display": ["lexend"],
                        "headline-sm": ["lexend"],
                        "body-lg": ["lexend"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "task-title": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "label": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF9F7;
        }

        .bg-gradient-radial {
            background: radial-gradient(circle, var(--tw-gradient-stops));
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center relative overflow-hidden font-body-sm text-text-primary py-12">
    <!-- Subtle atmospheric blurs -->
    <div
        class="absolute top-0 left-0 w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[100px] -translate-x-1/2 -translate-y-1/2 pointer-events-none">
    </div>
    <div
        class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[120px] translate-x-1/3 translate-y-1/3 pointer-events-none">
    </div>
    <main class="w-full max-w-[440px] px-screen-padding-mobile md:px-0 relative z-10">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img alt="FocusFlow Logo" class="w-12 h-12 rounded-md"
                src="https://lh3.googleusercontent.com/aida/AP1WRLvVfnOLfeDZEmOnoQeBs7a-e_TxAnhN77g7L8_qQv7YqZCfP09RPZr9FxiQ31hxPyS5NXL_QlTDHGwD7wyNpRB4C0P9fX6lsrzrb38m5pGlnTyeXFeqA4bq_lPgMnaUG6Bp5qGAY2Gg6V3eBkAWJcmsvRCX9uP23gGHP-jg9C1y37nDxyoCt3txJsGTZsy8BZYEE9ZU1xP4VuC7QilIEj3comtmtwPb0aeN8zYg4nuTNmIxJ6PGykkTT3c">
        </div>
        <!-- Login Card -->
        <div class="bg-surface rounded-xl border border-border p-8 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="font-headline-md text-headline-md text-text-primary mb-2">Welcome back</h1>
                <p class="font-body-lg text-body-lg text-text-secondary">Sign in to continue</p>
            </div>
            <!-- Form -->
            <form action="#" class="space-y-card-gap" method="POST">
                <!-- Email Field -->
                <div class="space-y-2">
                    <label class="block font-label text-label text-text-primary" for="email">Email</label>
                    <input
                        class="w-full bg-surface border border-border rounded-lg px-4 py-4 text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all duration-200 outline-none"
                        id="email" name="email" placeholder="alex@example.com" type="email">
                </div>
                <!-- Password Field -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block font-label text-label text-text-primary" for="password">Password</label>
                        <a class="font-body-sm text-body-sm text-text-secondary hover:underline transition-all"
                            href="#">Forgot password?</a>
                    </div>
                    <input
                        class="w-full bg-surface border border-border rounded-lg px-4 py-4 text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all duration-200 outline-none"
                        id="password" name="password" placeholder="••••••••" type="password">
                </div>
                <!-- Error State (Visible for demonstration) -->
                <div class="flex items-center justify-center gap-2 text-warning font-body-sm text-body-sm py-2">
                    <span class="material-symbols-outlined text-[18px]">error</span>
                    <span class="">Invalid email or password</span>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full bg-primary-container text-on-primary font-task-title text-task-title py-4 rounded-lg hover:opacity-90 transition-opacity flex justify-center items-center"
                    type="submit">
                    Sign In
                </button>
            </form>
            <!-- Sign Up Link -->
            <div class="mt-8 text-center font-body-sm text-body-sm text-text-secondary">
                Don't have an account?
                <a class="text-primary-container font-medium hover:underline transition-all" href="/signup">Sign up</a>
            </div>
        </div>
    </main>


</body>

</html>
