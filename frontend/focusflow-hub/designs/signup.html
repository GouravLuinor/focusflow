<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sign Up | FocusFlow</title>
    <!-- Google Fonts: Lexend -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <!-- Material Symbols Outlined -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#e0dfde",
                        "error-container": "#ffdad6",
                        "text-muted": "#9E988E",
                        "on-secondary-fixed-variant": "#464746",
                        "inverse-primary": "#c3c0ff",
                        "background": "#FAF9F7",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#dad7ff",
                        "secondary": "#5e5e5d",
                        "on-secondary-fixed": "#1a1c1b",
                        "text-primary": "#1A1A1A",
                        "active-glow": "rgba(79, 70, 229, 0.15)",
                        "surface-container-highest": "#e4e1ee",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#ffd2be",
                        "surface-tint": "#4d44e3",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-primary-fixed": "#0f0069",
                        "border": "#E8E6E1",
                        "surface-container": "#f0ecf9",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#302f39",
                        "surface": "#FFFFFF",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "on-error": "#ffffff",
                        "on-background": "#1b1b24",
                        "surface-container-low": "#f5f2ff",
                        "on-secondary-container": "#626361",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#464555",
                        "warning": "#D97706",
                        "tertiary-fixed": "#ffdbcc",
                        "tertiary": "#7e3000",
                        "primary-container": "#4f46e5",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-variant": "#e4e1ee",
                        "text-secondary": "#6B6660",
                        "on-tertiary-fixed": "#351000",
                        "on-surface": "#1b1b24",
                        "tertiary-container": "#a44100",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#c7c6c5",
                        "surface-bright": "#fcf8ff",
                        "surface-container-high": "#eae6f4",
                        "primary": "#3525cd",
                        "outline": "#777587",
                        "success": "#059669",
                        "secondary-fixed": "#e3e2e0",
                        "primary-fixed": "#e2dfff",
                        "primary-fixed-dim": "#c3c0ff",
                        "outline-variant": "#c7c4d8",
                        "surface-dim": "#dcd8e5",
                        "inverse-on-surface": "#f3effc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "screen-padding-mobile": "24px",
                        "section-gap": "32px",
                        "screen-padding-desktop": "32px",
                        "card-padding": "32px",
                        "card-gap": "16px",
                        "element-gap": "12px"
                    },
                    "fontFamily": {
                        "label": ["Lexend"],
                        "body-sm": ["Lexend"],

                    "fontSize": {

                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],

                        "task-title": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],

                        "display": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]

            },

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .blur-decoration {
            filter: blur(100px);
            opacity: 0.15;
            z-index: 0;
        }
    </style>
</head>

<body class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden pt-12">
    <!-- Decorative Corner Blurs -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-container rounded-full blur-decoration"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary-container rounded-full blur-decoration"></div>
    <!-- Main Container -->
    <div class="w-full max-w-[440px] px-screen-padding-mobile z-10 flex flex-col items-center">
        <!-- Logo Header -->
        <div class="transition-transform duration-500 hover:scale-105 mt-8 mb-12">
            <img alt="FocusFlow Logo" class="h-12 w-12 object-contain"
                src="https://lh3.googleusercontent.com/aida/AP1WRLvVfnOLfeDZEmOnoQeBs7a-e_TxAnhN77g7L8_qQv7YqZCfP09RPZr9FxiQ31hxPyS5NXL_QlTDHGwD7wyNpRB4C0P9fX6lsrzrb38m5pGlnTyeXFeqA4bq_lPgMnaUG6Bp5qGAY2Gg6V3eBkAWJcmsvRCX9uP23gGHP-jg9C1y37nDxyoCt3txJsGTZsy8BZYEE9ZU1xP4VuC7QilIEj3comtmtwPb0aeN8zYg4nuTNmIxJ6PGykkTT3c">
        </div>
        <!-- Signup Card -->
        <main
            class="w-full bg-surface rounded-xl border border-border shadow-sm p-card-padding transition-all duration-300">
            <!-- Card Header -->
            <header class="text-center mb-8">
                <h1 class="font-headline-md text-headline-md text-text-primary mb-2">Create your account</h1>
                <p class="font-body-lg text-body-lg text-text-secondary">Start building better workflows</p>
            </header>
            <!-- Signup Form -->
            <form action="#" class="flex flex-col gap-card-gap" method="POST" onsubmit="return false;">
                <!-- Full Name Field -->
                <div class="flex flex-col gap-2">
                    <label class="font-label text-label text-text-secondary" for="full-name">Full name</label>
                    <input
                        class="w-full bg-surface border border-border rounded-lg p-3 text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all"
                        id="full-name" name="full-name" placeholder="Alex Johnson" type="text">
                </div>
                <!-- Email Field with Error State -->
                <div class="flex flex-col gap-2">
                    <label class="font-label text-label text-text-secondary" for="email">Email</label>
                    <div class="relative">
                        <input
                            class="w-full bg-surface border border-warning rounded-lg p-3 text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-warning focus:border-warning outline-none transition-all"
                            id="email" name="email" placeholder="alex@example.com" type="email" value="alex@example">
                    </div>
                    <div class="flex items-center gap-1.5 text-warning">
                        <span class="material-symbols-outlined text-[16px]">error</span>
                        <span class="font-body-sm text-body-sm">Please enter a valid email</span>
                    </div>
                </div>
                <!-- Password Field -->
                <div class="flex flex-col gap-2">
                    <label class="font-label text-label text-text-secondary" for="password">Password</label>
                    <input
                        class="w-full bg-surface border border-border rounded-lg p-3 text-text-primary placeholder:text-text-muted focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all"
                        id="password" name="password" placeholder="••••••••" type="password">
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full bg-primary-container text-on-primary font-task-title text-task-title py-4 rounded-lg mt-2 hover:opacity-90 active:scale-[0.98] transition-all duration-200"
                    type="submit">
                    Create Account
                </button>
            </form>
            <!-- Card Footer -->
            <footer class="mt-8 text-center">
                <p class="font-body-sm text-body-sm text-text-secondary">
                    Already have an account?
                    <a class="text-primary-container font-medium hover:underline transition-all" href="#">Sign in</a>
                </p>
            </footer>
        </main>
        <!-- Legal Links (Subtle/Low priority outside card as implied by 'No footer outside card', but added tiny accessibility text if needed) -->
        <p class="mt-8 font-body-sm text-[12px] text-text-muted opacity-60 text-center">
            © 2024 FocusFlow. Calm productivity for everyone.
        </p>
    </div>
    <!-- Micro-interaction for input states -->
    <script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                // Potential for subtle glow effect addition via JS if required
                console.log('Focus state active for neuro-reassurance');
            });
        });
    </script>


</body>

</html>
