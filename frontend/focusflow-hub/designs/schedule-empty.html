<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FocusFlow - Schedule</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#e3e2e0",
                        "active-glow": "rgba(79, 70, 229, 0.15)",
                        "secondary-fixed-dim": "#c7c6c5",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "outline": "#777587",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "text-secondary": "#6B6660",
                        "on-secondary-fixed-variant": "#464746",
                        "inverse-surface": "#302f39",
                        "surface-container": "#f0ecf9",
                        "text-primary": "#1A1A1A",
                        "on-surface-variant": "#464555",
                        "surface-container-highest": "#e4e1ee",
                        "secondary-container": "#e0dfde",
                        "background": "#fcf8ff",
                        "on-secondary-container": "#626361",
                        "surface-bright": "#fcf8ff",
                        "surface-variant": "#e4e1ee",
                        "text-muted": "#9E988E",
                        "warning": "#D97706",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface": "#FFFFFF",
                        "on-background": "#1b1b24",
                        "primary": "#3525cd",
                        "on-tertiary-fixed": "#351000",
                        "on-tertiary-container": "#ffd2be",
                        "on-secondary-fixed": "#1a1c1b",
                        "on-error": "#ffffff",
                        "primary-container": "#4f46e5",
                        "on-primary-container": "#dad7ff",
                        "border": "#E8E6E1",
                        "on-surface": "#1b1b24",
                        "inverse-primary": "#c3c0ff",
                        "tertiary-container": "#a44100",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f3effc",
                        "outline-variant": "#c7c4d8",
                        "tertiary-fixed": "#ffdbcc",
                        "surface-dim": "#dcd8e5",
                        "surface-tint": "#4d44e3",
                        "tertiary-fixed-dim": "#ffb695",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "secondary": "#5e5e5d",
                        "tertiary": "#7e3000",
                        "success": "#059669",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f5f2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "32px",
                        "screen-padding-mobile": "24px",
                        "element-gap": "12px",
                        "screen-padding-desktop": "32px",
                        "card-gap": "16px",
                        "card-padding": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Lexend", "sans-serif"],
                        "display": ["Lexend", "sans-serif"],
                        "headline-md": ["Lexend", "sans-serif"],
                        "body-sm": ["Lexend", "sans-serif"],
                        "task-title": ["Lexend", "sans-serif"],
                        "label": ["Lexend", "sans-serif"],
                        "headline-sm": ["Lexend", "sans-serif"],
                        "body-lg": ["Lexend", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "task-title": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "label": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF9F7;
            /* Override background to match prompt request closely, though we should use theme ideally. Prompt asked for #FAF9F7 */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }

        /* Subtle fade-in animation for empty state */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

<body class="text-text-primary min-h-screen flex">
    <!-- SideNavBar (Desktop) -->
    <nav
        class="hidden md:flex flex-col h-full py-screen-padding-desktop bg-surface dark:bg-surface-dim fixed left-0 top-0 h-screen w-64 border-r border-border dark:border-outline z-20">
        <div class="px-6 mb-8">
            <h1 class="font-display text-headline-md text-primary dark:text-primary-fixed">FocusFlow</h1>
            <p class="font-label text-label text-text-secondary mt-1">One task at a time</p>
        </div>
        <div class="flex-1 px-4 space-y-2">
            <!-- Tasks -->
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-variant transition-transform duration-200 hover:scale-[1.01]"
                href="#">
                <span class="material-symbols-outlined" data-icon="assignment_turned_in">assignment_turned_in</span>
                <span class="font-label text-label">Tasks</span>
            </a>
            <!-- Focus (Active - assuming Schedule context relates closely to Focus/planning) -->
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-active-glow text-primary dark:text-primary-fixed font-bold border-l-4 border-primary scale-[1.01]"
                href="#">
                <span class="material-symbols-outlined" data-icon="center_focus_strong"
                    data-weight="fill">center_focus_strong</span>
                <span class="font-label text-label">Focus</span>
            </a>
            <!-- Insights -->
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-variant transition-transform duration-200 hover:scale-[1.01]"
                href="#">
                <span class="material-symbols-outlined" data-icon="insights">insights</span>
                <span class="font-label text-label">Insights</span>
            </a>
            <!-- Settings -->
            <a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-low dark:hover:bg-surface-variant transition-transform duration-200 hover:scale-[1.01]"
                href="#">
                <span class="material-symbols-outlined" data-icon="settings">settings</span>
                <span class="font-label text-label">Settings</span>
            </a>
        </div>
        <div class="px-6 mt-auto">
            <button
                class="w-full bg-primary-container text-on-primary py-3 px-4 rounded-lg font-label text-label hover:bg-primary transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined" data-icon="add">add</span>
                New Task
            </button>
        </div>
    </nav>
    <!-- Main Content Wrapper -->
    <div class="flex-1 md:ml-64 flex flex-col min-h-screen">
        <!-- TopAppBar -->
        <header
            class="w-full h-16 bg-background dark:bg-on-background flex justify-between items-center px-screen-padding-desktop ml-auto z-10 sticky top-0">
            <div class="flex-1 md:hidden">
                <span class="font-display text-display text-primary dark:text-primary-fixed text-2xl">FocusFlow</span>
            </div>
            <div class="flex-1 hidden md:block">
                <!-- Empty spacer for desktop since logo is in sidebar -->
            </div>
            <div class="flex items-center gap-4 text-on-surface-variant dark:text-outline-variant">
                <button
                    class="hover:text-primary dark:hover:text-primary-fixed transition-colors duration-200 ease-in-out">
                    <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
                </button>
                <button
                    class="hover:text-primary dark:hover:text-primary-fixed transition-colors duration-200 ease-in-out">
                    <span class="material-symbols-outlined" data-icon="help">help</span>
                </button>
                <div class="w-8 h-8 rounded-full bg-surface-container-highest border border-border overflow-hidden">
                    <img alt="User profile" class="w-full h-full object-cover"
                        data-alt="A minimal user profile avatar showing a simple geometric shape in calm indigo tones on a light gray background. The style is flat, corporate, and clean."
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDc3j1av55-DQgnM2ycjgSqCr24HN6rS2AH_S-nPakurA7xG3hfDBYqQd3JZTC6o1GGMP9EYvWqyT5f6rekL5iyJ-Yb3mNK2QFniCXRi4_2wUNW870EKtxmM8MvV7XzzV3-fju3xYH9LgK2DRFo-h5pOSAZZ6NpvM_0nXb6lgnBVSaCxIhZfVts-7TiltcOch40x4E8tSJ8NcjbHbHCVbA9UvU1luxoLYCHcmYAcI0MVtadz2WWw8sRG9LwjHe9ZY26zmQtA3OoYck" />
                </div>
            </div>
        </header>
        <!-- Main Canvas -->
        <main class="flex-1 flex items-center justify-center p-screen-padding-desktop">
            <!-- Empty State Card -->
            <div
                class="max-w-md w-full bg-surface border border-border rounded-xl p-8 flex flex-col items-center text-center shadow-sm animate-fade-in">
                <!-- Illustration Placeholder (Using an abstract SVG for calm/friendly feel) -->
                <div class="w-48 h-48 mb-6 text-primary-container opacity-80 flex items-center justify-center">
                    <svg class="w-full h-full" fill="none" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M100 180C144.183 180 180 144.183 180 100C180 55.8172 144.183 20 100 20C55.8172 20 20 55.8172 20 100C20 144.183 55.8172 180 100 180Z"
                            fill="currentColor" fill-opacity="0.1"></path>
                        <path
                            d="M140 100C140 122.091 122.091 140 100 140C77.9086 140 60 122.091 60 100C60 77.9086 77.9086 60 100 60"
                            stroke="currentColor" stroke-linecap="round" stroke-width="8"></path>
                        <circle cx="85" cy="90" fill="currentColor" r="6"></circle>
                        <circle cx="115" cy="90" fill="currentColor" r="6"></circle>
                        <path d="M90 115C95 120 105 120 110 115" stroke="currentColor" stroke-linecap="round"
                            stroke-width="6"></path>
                    </svg>
                </div>
                <h2 class="font-headline-md text-headline-md text-text-primary mb-2">No sessions planned yet</h2>
                <p class="font-body-sm text-body-sm text-text-secondary mb-8 max-w-sm">
                    Take a moment to map out your day. FocusFlow helps you break down work into manageable blocks.
                </p>
                <button
                    class="w-full bg-primary-container text-on-primary py-3 px-6 rounded-lg font-task-title text-task-title mb-4 hover:bg-primary transition-colors duration-200">
                    Generate your first daily plan
                </button>
                <a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-4 hover:underline"
                    href="#">
                    Or add a manual focus block
                </a>
            </div>
        </main>
    </div>
</body>

</html>
